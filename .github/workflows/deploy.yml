name: Deploy DABIT DOCS to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build Quartz (Korean → public)
        run: npx quartz build
      - name: Build Quartz (English → public/en)
        # 반드시 한글 다음. 빌드는 출력 폴더를 먼저 지운다 — 한글이 뒤에 돌면 public/en이 사라진다
        run: npx quartz build -d content-en -o public/en
        env:
          DOCS_LANG: en
      - name: Copy CNAME
        run: cp content/CNAME public/CNAME 2>/dev/null || true
      - name: Copy search engine verification files
        # Quartz strips .html from content assets (slugifyFilePath) — copy as-is to site root
        run: cp content/google*.html content/naver*.html public/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
